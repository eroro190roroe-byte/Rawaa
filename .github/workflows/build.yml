name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ArabicInkOverlay.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build debug APK
        working-directory: ArabicInkOverlay
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-ink-apk
          path: ArabicInkOverlay/app/build/outputs/apk/debug/app-debug.apk
